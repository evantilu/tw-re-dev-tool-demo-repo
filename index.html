<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>區域成交地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --surface: #fcfcfb; --plane: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --hair: #e1e0d9; --critical: #d03b3b; --unknown: #b5b3ab;
    --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab; --seq-5: #104281;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink); }
  #app { display: flex; height: 100%; }
  #panel { width: 300px; flex: none; overflow-y: auto; padding: 14px 16px; box-sizing: border-box;
           background: var(--surface); border-right: 1px solid var(--hair); font-size: 13px; }
  #map { flex: 1; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  h2 { font-size: 12px; color: var(--ink-2); margin: 16px 0 6px; font-weight: 600; letter-spacing: .02em; }
  label { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input[type=month], .row input[type=number] { flex: 1; min-width: 0; font: inherit; padding: 3px 4px; }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .warn { color: var(--critical); }
  .major { color: var(--critical); font-weight: 600; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .sq { border-radius: 2px; }
  .ring { box-sizing: border-box; border: 2.5px solid var(--critical); background: transparent; }
  .status { background: var(--plane); border: 1px solid var(--hair); border-radius: 6px; padding: 8px; margin-top: 6px; }
  .status div { display: flex; justify-content: space-between; }
  #legend .legend-item { justify-content: flex-start; }
  button { font: inherit; padding: 3px 8px; margin-top: 4px; cursor: pointer; }
  .rent-icon { box-sizing: border-box; border: 1px solid #fff; border-radius: 2px; }
  .rent-icon.flagged { border: 2.5px solid var(--critical); }
  .pop { font-size: 12px; min-width: 260px; }
  .pop h3 { font-size: 13px; margin: 0 0 4px; }
  .pop table { border-collapse: collapse; width: 100%; }
  .pop td { padding: 1px 4px 1px 0; vertical-align: top; }
  .pop td:first-child { color: var(--muted); white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 9px; margin: 0 4px 3px 0;
           background: #f0efec; color: var(--ink-2); }
  .badge.major { background: #fbe9e9; color: var(--critical); }
  .pop .note { color: var(--ink-2); margin-top: 4px; white-space: pre-wrap; }
  .pop .sec { margin-top: 8px; border-top: 1px solid var(--hair); padding-top: 6px; }
  .pop .sec ul { margin: 4px 0 0; padding-left: 16px; }
  .pop .sec li { margin: 3px 0; color: var(--ink-2); line-height: 1.45; }
  .pop .sec li.major-li { color: var(--ink); }
  .pop .muted { color: var(--muted); margin-top: 3px; }
  .pop .links { display: flex; gap: 12px; margin-top: 6px; }
  .pop .same { margin-top: 6px; border-top: 1px solid var(--hair); padding-top: 4px; }
  .pop .same td { font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #panel { width: 100%; max-height: 45%; border-right: 0; border-bottom: 1px solid var(--hair); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1 id="title">成交地圖</h1>
    <div class="sub" id="subtitle"></div>

    <h2>圖層</h2>
    <div id="layers"></div>

    <h2>著色</h2>
    <label><input type="radio" name="color" value="up" checked> 單價（買賣：萬／坪；租賃：元／坪）</label>
    <label><input type="radio" name="color" value="age"> 屋齡（交易時）</label>
    <label><input type="radio" name="color" value="floor"> 樓層</label>
    <div id="legend" class="status"></div>

    <h2>交易期間</h2>
    <div class="row"><input type="month" id="from"> ～ <input type="month" id="to"></div>

    <h2>屋齡（交易時，年）</h2>
    <div class="row"><input type="number" id="ageMin" placeholder="最小"> ～ <input type="number" id="ageMax" placeholder="最大"></div>

    <h2>標記（取消勾選＝隱藏有此標記的交易）</h2>
    <div id="flags"></div>
    <button id="hideMajor">隱藏所有重大標記</button>
    <button id="showAll">全部顯示</button>

    <h2>目前顯示</h2>
    <div id="status" class="status"></div>
  </div>
  <div id="map"></div>
</div>

<script src="layers/index.js"></script>
<script>
// 依 layers/index.js 的清單載入各圖層檔（直接開本機檔案時不能用 fetch，所以用 <script>）
(function loadLayers() {
  const files = TWRE.manifest.layers;
  let done = 0;
  files.forEach(f => {
    const s = document.createElement("script");
    s.src = "layers/" + f;
    s.onload = () => { if (++done === files.length) init(); };
    s.onerror = () => alert("載入圖層失敗：" + f);
    document.body.appendChild(s);
  });
})();

const SEQ = [1, 2, 3, 4, 5].map(i => `var(--seq-${i})`);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v.slice(4, -1)).trim();
const fmt = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString("zh-TW", { maximumFractionDigits: d, minimumFractionDigits: d });

const state = { color: "up", visible: {}, hiddenFlags: new Set() };
let map, layers;

function quantileBins(values) {
  const v = values.filter(x => x != null).sort((a, b) => a - b);
  return [0.2, 0.4, 0.6, 0.8].map(q => v[Math.floor(q * (v.length - 1))]);
}

// 每種著色方式：bins（上界）與圖例文字。單價依圖層各自分五等分（買賣、租賃單位不同）。
function scale(layer) {
  if (state.color === "up") {
    const b = layer.upBins, u = layer.kind === "sale" ? "萬" : "元", d = layer.kind === "sale" ? 1 : 0;
    return { get: r => r.up, bins: b,
             labels: [`≤ ${fmt(b[0], d)}${u}`, `${fmt(b[0], d)}–${fmt(b[1], d)}`, `${fmt(b[1], d)}–${fmt(b[2], d)}`,
                      `${fmt(b[2], d)}–${fmt(b[3], d)}`, `> ${fmt(b[3], d)}${u}`] };
  }
  if (state.color === "age") {
    return { get: r => r.age, bins: [30, 40, 45, 50], strict: true, labels: ["< 30 年", "30–40 年", "40–45 年", "45–50 年", "≥ 50 年"] };
  }
  return { get: r => r.floor, bins: [1, 2, 3, 4], labels: ["1 樓", "2 樓", "3 樓", "4 樓", "5 樓以上"] };
}

function colorOf(sc, r) {
  const v = sc.get(r);
  if (v == null) return css("var(--unknown)");
  const i = sc.bins.findIndex(b => (sc.strict ? v < b : v <= b));
  return css(SEQ[i === -1 ? 4 : i]);
}

function isMajor(r) { return r.flags.some(f => TWRE.manifest.flags[f]?.level === "major"); }

function passes(r) {
  const from = document.getElementById("from").value, to = document.getElementById("to").value;
  const ym = r.date.slice(0, 7);
  if (from && ym < from) return false;
  if (to && ym > to) return false;
  const aMin = parseFloat(document.getElementById("ageMin").value), aMax = parseFloat(document.getElementById("ageMax").value);
  if (!isNaN(aMin) && (r.age == null || r.age < aMin)) return false;
  if (!isNaN(aMax) && (r.age == null || r.age > aMax)) return false;
  return !r.flags.some(f => state.hiddenFlags.has(f));
}

// 同一棟的多筆交易座標相同，排成小圓圈避免完全重疊
function spreadSameBuilding() {
  const groups = {};
  layers.forEach(L => L.records.forEach(r => (groups[r.lat + "," + r.lon] ||= []).push(r)));
  Object.values(groups).forEach(g => {
    g.forEach((r, i) => {
      r.same = g;
      if (g.length === 1) { r.plat = r.lat; r.plon = r.lon; return; }
      const radius = 4 + 1.5 * Math.floor(i / 8), ang = (2 * Math.PI * (i % 8)) / Math.min(8, g.length);
      r.plat = r.lat + radius * Math.sin(ang) / 111320;
      r.plon = r.lon + radius * Math.cos(ang) / (111320 * Math.cos(r.lat * Math.PI / 180));
    });
  });
}

// ── 周邊比較：同類型、交易時屋齡 ±5 年、交易日前後 6 個月、排除有重大標記的交易 ──
const NEAR_M = 500;
function distM(a, b) {
  const dy = (a.lat - b.lat) * 111320, dx = (a.lon - b.lon) * 111320 * Math.cos(a.lat * Math.PI / 180);
  return Math.hypot(dx, dy);
}
const monthsApart = (a, b) => Math.abs(new Date(a) - new Date(b)) / (30.44 * 86400000);
const median = v => { const s = [...v].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function peers(r, L) {
  return L.records.filter(o => o !== r && o.up != null && o.age != null && !isMajor(o)
    && (L.kind !== "rent" || o.rtype === r.rtype)
    && Math.abs(o.age - r.age) <= 5 && monthsApart(o.date, r.date) <= 6);
}

function compareHtml(r, L) {
  if (r.up == null || r.age == null) return `<div class="sec"><b>周邊比較</b><div class="muted">缺單價或屋齡，無法比較。</div></div>`;
  const unit = L.kind === "sale" ? "萬／坪" : "元／坪", d = L.kind === "sale" ? 1 : 0;
  const all = peers(r, L), near = all.filter(o => distM(o, r) <= NEAR_M);
  const line = (name, g) => {
    if (g.length < 5) return `<tr><td>${name}</td><td colspan="2" class="muted">樣本不足（${g.length} 筆）</td></tr>`;
    const med = median(g.map(o => o.up)), diff = (r.up / med - 1) * 100;
    const pct = Math.round(100 * g.filter(o => o.up < r.up).length / g.length);
    return `<tr><td>${name}（${g.length} 筆）</td><td>中位數 ${fmt(med, d)} ${unit}</td>` +
      `<td><b>這筆${diff >= 0 ? "高" : "低"} ${fmt(Math.abs(diff), 0)}%，第 ${pct} 百分位</b></td></tr>`;
  };
  const cond = `交易時屋齡 ${fmt(r.age - 5, 0)}–${fmt(r.age + 5, 0)} 年、交易日前後 6 個月` +
    (L.kind === "rent" ? `、同為「${r.rtype || "未填"}」` : "") + "，已排除有重大標記的交易";
  return `<div class="sec"><b>周邊比較</b><table>${line(`${NEAR_M} 公尺內`, near)}${line("全區", all)}</table>` +
    `<div class="muted">比較對象：${cond}。${isMajor(r) ? '<span class="warn">這筆本身有重大標記，比較結果僅供參考。</span>' : ""}</div></div>`;
}

// ── 看這筆要注意：標記說明 + 由樓層、屋齡、土地等欄位帶出的觀察重點 ──
function noticeHtml(r, L) {
  const F = TWRE.manifest.flags, items = [];
  r.flags.forEach(f => F[f] && items.push(
    `<li class="${F[f].level === "major" ? "major-li" : ""}"><b>${F[f].level === "major" ? "⚠ " : ""}${F[f].label}</b>：${F[f].guide}</li>`));
  if (r.floor === 1) items.push("<li><b>一樓</b>：公寓一樓常可做店面，或附前後院、地下室，單價通常高於樓上。比價時盡量和一樓比。</li>");
  else if (r.floor != null && r.tf && r.floor === r.tf) items.push("<li><b>頂樓</b>：留意漏水、隔熱和防水層狀況；若有頂樓加蓋，加蓋部分不在登記面積內。</li>");
  if (r.floor >= 4) items.push("<li><b>4 樓以上、沒有電梯</b>：爬樓梯對自住和出租都扣分，單價通常比 2、3 樓低，租客也比較挑。</li>");
  if (r.pre921) items.push("<li><b>921（1999）前建造</b>：適用較舊的耐震規範。看屋時留意樑柱裂縫、鋼筋外露、是否做過耐震評估。</li>");
  if (r.age_now >= 30) items.push("<li><b>現在屋齡 30 年以上</b>：達到危老重建的屋齡門檻（另須耐震評估未達標準）。能不能都更、危老，要看基地大小和住戶整合，不是屋齡夠就能做。</li>");
  if (L.kind === "sale" && r.land > 0) {
    items.push(`<li><b>土地持分 ${fmt(r.land, 2)} 坪</b>，換算每坪土地約 ${fmt(r.price / r.land, 0)} 萬（總價 ÷ 持分）。都更時分回多少主要看土地持分；同樣總價，持分越大，土地價值越高。</li>`);
    if (r.zoning && r.zoning.includes("商")) items.push("<li><b>商業區</b>：法定容積率比住宅區高，都更或重建時可蓋的樓地板較多。</li>");
  }
  if (L.kind === "rent" && /分租|雅房/.test(r.rtype || "")) items.push("<li><b>分租</b>：每坪租金可能是整戶面積攤算或只算單間，和整層出租不能直接比。周邊比較已限定同出租型態。</li>");
  return items.length ? `<div class="sec"><b>看這筆要注意</b><ul>${items.join("")}</ul></div>` : "";
}

function linksHtml(r) {
  const q = encodeURIComponent(r.addr.replace(/\s/g, ""));
  return `<div class="links"><a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${r.lat},${r.lon}" target="_blank" rel="noopener">Google 街景</a>` +
    `<a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google 地圖</a></div>`;
}

function popupHtml(r, L) {
  const F = TWRE.manifest.flags;
  const badges = r.flags.map(f => `<span class="badge ${F[f]?.level === "major" ? "major" : ""}">${F[f]?.level === "major" ? "⚠ " : ""}${F[f]?.label || f}</span>`).join("");
  const rows = L.kind === "sale" ? [
    ["總價", `${fmt(r.price, 0)} 萬`], ["單價", `${fmt(r.up, 2)} 萬／坪`],
    ["建物面積", `${fmt(r.area, 2)} 坪`], ["土地持分", `${fmt(r.land, 2)} 坪`],
  ] : [
    ["月租", `${fmt(r.rent)} 元`], ["每坪租金", `${fmt(r.up)} 元／坪`], ["出租型態", r.rtype || "—"],
    ["面積", `${fmt(r.area, 2)} 坪`], ["附傢俱", r.furnished || "—"],
  ];
  rows.push(
    ["交易日期", r.date], ["樓層", `${r.floors_text || "—"}／共 ${fmt(r.tf)} 層`], ["格局", r.layout],
    ["屋齡", `交易時 ${fmt(r.age, 1)} 年；現在 ${fmt(r.age_now, 1)} 年${r.pre921 ? "（921 前建造）" : ""}`],
    ["建築完成", r.built || "—"],
  );
  if (L.kind === "sale") rows.push(["地段地號", r.parcels || "—"], ["使用分區", r.zoning || "—"]);
  if (r.geo === "approx") rows.push(["定位", "近似（門牌檔無「之X」，以主號定位）"]);
  rows.push(["編號", r.id]);

  const others = r.same.filter(o => o !== r).sort((a, b) => b.date.localeCompare(a.date));
  const same = others.length ? `<div class="same"><b>同棟其他 ${others.length} 筆</b><table>` +
    others.slice(0, 12).map(o => `<tr><td>${o.date}</td><td>${o.floors_text || ""}</td><td>${
      o.price != null ? `買 ${fmt(o.price)} 萬（${fmt(o.up, 1)} 萬/坪）` : `租 ${fmt(o.rent)} 元（${o.rtype || ""}）`
    }</td><td>${isMajor(o) ? '<span class="warn">⚠</span>' : ""}</td></tr>`).join("") +
    (others.length > 12 ? `<tr><td colspan="4">…還有 ${others.length - 12} 筆</td></tr>` : "") + "</table></div>" : "";

  return `<div class="pop"><h3>${L.name}｜${r.addr}</h3>${badges ? `<div>${badges}</div>` : ""}<table>` +
    rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") + "</table>" + linksHtml(r) +
    compareHtml(r, L) + noticeHtml(r, L) +
    (r.note ? `<div class="note">備註原文：${r.note}</div>` : "") + same + "</div>";
}

function render() {
  layers.forEach(L => {
    L.group.clearLayers();
    L.shown = 0;
    if (!state.visible[L.id]) return;
    const sc = scale(L);
    L.records.forEach(r => {
      if (!passes(r)) return;
      L.shown++;
      const fill = colorOf(sc, r), major = isMajor(r);
      let m;
      if (L.kind === "sale") {
        m = L.circle(r, fill, major);
      } else {
        m = L.marker(r, fill, major);
      }
      m.bindPopup(() => popupHtml(r, L), { maxWidth: 400, maxHeight: Math.round(window.innerHeight * 0.7) });
      L.group.addLayer(m);
    });
  });
  renderLegend();
  renderStatus();
}

function renderLegend() {
  const parts = [];
  layers.filter(L => state.visible[L.id]).forEach(L => {
    const sc = scale(L);
    parts.push(`<div style="margin:4px 0 2px;color:var(--ink-2)">${L.name}</div>`);
    sc.labels.forEach((t, i) => parts.push(
      `<div class="legend-item"><span class="sw ${L.kind === "rent" ? "sq" : ""}" style="background:${css(SEQ[i])}"></span>${t}</div>`));
  });
  parts.push(`<div class="legend-item"><span class="sw" style="background:${css("var(--unknown)")}"></span>無資料</div>`);
  parts.push(`<div class="legend-item"><span class="sw ring"></span><span class="major">有重大標記（點開看原因）</span></div>`);
  parts.push(`<div class="legend-item"><span class="sw" style="background:var(--muted)"></span>圓形＝買賣</div>`);
  parts.push(`<div class="legend-item"><span class="sw sq" style="background:var(--muted)"></span>方形＝租賃</div>`);
  document.getElementById("legend").innerHTML = parts.join("");
}

function renderStatus() {
  document.getElementById("status").innerHTML = layers.map(L =>
    `<div><span>${L.name}</span><span>${state.visible[L.id] ? fmt(L.shown) : "（關閉）"} / ${fmt(L.records.length)}</span></div>` +
    (L.unlocated ? `<div class="warn"><span>　未定位</span><span>${fmt(L.unlocated)} 筆</span></div>` : "")
  ).join("") + `<div style="color:var(--muted);margin-top:4px;display:block">未定位清單：data/processed/unmatched.csv</div>`;
}

function renderFlagControls() {
  const F = TWRE.manifest.flags, counts = {};
  layers.forEach(L => L.records.forEach(r => r.flags.forEach(f => counts[f] = (counts[f] || 0) + 1)));
  const codes = Object.keys(counts).sort((a, b) => (F[a].level !== "major") - (F[b].level !== "major") || counts[b] - counts[a]);
  document.getElementById("flags").innerHTML = codes.map(c =>
    `<label><input type="checkbox" data-flag="${c}" ${state.hiddenFlags.has(c) ? "" : "checked"}>` +
    `<span class="${F[c].level === "major" ? "major" : ""}">${F[c].level === "major" ? "⚠ " : ""}${F[c].label}</span>` +
    `<span class="count">${fmt(counts[c])}</span></label>`).join("");
  document.querySelectorAll("#flags input").forEach(el => el.onchange = () => {
    el.checked ? state.hiddenFlags.delete(el.dataset.flag) : state.hiddenFlags.add(el.dataset.flag);
    render();
  });
}

function init() {
  const M = TWRE.manifest;
  layers = TWRE.layers;
  document.getElementById("title").textContent = `${M.district}公寓 成交地圖`;
  document.getElementById("subtitle").textContent = `季別 ${M.seasons.at(-1)}–${M.seasons[0]}｜資料更新 ${M.updated}`;

  map = L.map("map", { preferCanvas: true }).setView(M.center, M.zoom);
  const emap = L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}",
    { maxZoom: 20, maxNativeZoom: 19, attribution: "國土測繪中心 電子地圖" }).addTo(map);
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 20, maxNativeZoom: 19, attribution: "© OpenStreetMap" });
  L.control.layers({ "國土測繪中心電子地圖": emap, "OpenStreetMap": osm }, null, { position: "topright" }).addTo(map);

  const renderer = L.canvas({ padding: 0.5 });
  layers.forEach(Ly => {
    Ly.upBins = quantileBins(Ly.records.map(r => r.up));
    Ly.group = L.layerGroup().addTo(map);
    state.visible[Ly.id] = true;
    Ly.circle = (r, fill, major) => L.circleMarker([r.plat, r.plon], {
      renderer, radius: 6, fillColor: fill, fillOpacity: 0.9,
      color: major ? css("var(--critical)") : "#ffffff", weight: major ? 2.5 : 1 });
    Ly.marker = (r, fill, major) => L.marker([r.plat, r.plon], { icon: L.divIcon({
      className: "", iconSize: [11, 11],
      html: `<div class="rent-icon ${major ? "flagged" : ""}" style="width:11px;height:11px;background:${fill}"></div>` }) });
  });
  spreadSameBuilding();

  const dates = layers.flatMap(L => L.records.map(r => r.date.slice(0, 7))).sort();
  document.getElementById("from").value = dates[0];
  document.getElementById("to").value = dates.at(-1);

  document.getElementById("layers").innerHTML = layers.map(L =>
    `<label><input type="checkbox" data-layer="${L.id}" checked>${L.name}<span class="count">${fmt(L.total)} 筆</span></label>`).join("");
  document.querySelectorAll("#layers input").forEach(el => el.onchange = () => { state.visible[el.dataset.layer] = el.checked; render(); });
  document.querySelectorAll("input[name=color]").forEach(el => el.onchange = () => { state.color = el.value; render(); });
  ["from", "to", "ageMin", "ageMax"].forEach(id => document.getElementById(id).oninput = render);
  document.getElementById("hideMajor").onclick = () => {
    Object.entries(M.flags).forEach(([c, f]) => f.level === "major" && state.hiddenFlags.add(c));
    renderFlagControls(); render();
  };
  document.getElementById("showAll").onclick = () => { state.hiddenFlags.clear(); renderFlagControls(); render(); };

  renderFlagControls();
  render();
}
</script>
</body>
</html>
